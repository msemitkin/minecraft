name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: '/code-review --comment'
          claude_args: >-
            --allowedTools
            Bash(git diff*),Bash(git log*),Bash(git show*),Bash(git blame*),
            Bash(gh pr diff*),Bash(gh pr view*),Bash(gh pr list*),
            mcp__github__create_review_comment,
            mcp__github__create_pending_review,
            mcp__github__submit_pending_review,
            mcp__github__list_pull_request_files,
            mcp__github__get_pull_request,
            Read,Glob,Grep
